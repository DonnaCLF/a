<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ôn trắc nghiệm địa</title>
    <link rel='stylesheet' href='index.css'>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #display{
            width: 85%;
            height: 90vh;
            padding-inline: 3%;
            border-radius: 100px;
            border: 5px solid black;
            transform: translateY(3%);
        }
        h1 {
            margin: 10vh;
            margin-bottom: 15vh;
        }
        a {
            font-size: 500%;
            border: 5px solid black;
            border-radius: 50px;
            padding-inline: 5%;
            padding-block: 3%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="display">
        <h1>Bộ câu hỏi trắc nghiệm ôn tập giữa học kì</h1>
        <a href="/địa/index.html">Bắt đầu</a>
    </div>
</body>
</html>
